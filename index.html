<html lang="en">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { font-family: 'Inter', sans-serif; color: #1a1a2e; background: #fff; }
    :root {
      --navy: #0D2B5E; --blue: #1565C0; --sky: #E3F2FD; --sky-dk: #BBDEFB;
      --white: #ffffff; --off: #F5F8FF; --text: #1a1a2e; --muted: #5a6a85;
      --border: #D0DFF5; --green: #0F6E56; --green-bg: #E8F5E9; --amber: #F9A825;

    nav {

      box-shadow: 0 2px 12px rgba(13,43,94,.3);

    .nav-cta:hover { opacity: .9; }
    .hero {

      padding: 90px 24px 80px; text-align: center;
    }
