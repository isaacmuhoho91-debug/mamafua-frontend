<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MamaFua — Create your account</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: #F5F8FF; min-height: 100vh; display: flex; flex-direction: column; }
    :root {
      --navy: #0D2B5E; --blue: #1565C0; --sky: #E3F2FD;
      --white: #ffffff; --text: #1a1a2e; --muted: #5a6a85;
      --border: #D0DFF5; --green: #0F6E56; --green-bg: #E8F5E9;
      --red: #C62828; --red-bg: #FFEBEE;
    }
    nav { background: var(--navy); padding: 0 24px; height: 62px; display: flex; align-items: center; justify-content: space-between; }
    .nav-brand { font-family: 'Playfair Display', serif; font-size: 22px; color: #fff; text-decoration: none; }
    .nav-right a { color: #BBDEFB; font-size: 13px; text-decoration: none; }
    .page { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 24px; }
    .card { background: var(--white); border-radius: 20px; box-shadow: 0 4px 32px rgba(13,43,94,0.10); padding: 40px 36px; width: 100%; max-width: 480px; }
    .card-title { font-family: 'Playfair Display', serif; font-size: 26px; color: var(--text); margin-bottom: 6px; }
    .card-sub { font-size: 13px; color: var(--muted); margin-bottom: 28px; }
    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: 13px; font-weight: 500; color: var(--text); margin-bottom: 5px; }
    .field input { width: 100%; padding: 11px 14px; border: 1.5px solid var(--border); border-radius: 10px; font-size: 14px; font-family: 'Inter', sans-serif; color: var(--text); outline: none; transition: border-color .15s; }
    .field input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(21,101,192,.1); }
    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .btn-submit { width: 100%; background: var(--blue); color: #fff; border: none; padding: 13px; border-radius: 32px; font-size: 15px; font-weight: 600; cursor: pointer; font-family: 'Inter', sans-serif; margin-top: 8px; transition: background .15s; }
    .btn-submit:hover { background: var(--navy); }
    .btn-submit:disabled { background: #9fb8de; cursor: not-allowed; }
    .login-link { text-align: center; font-size: 13px; color: var(--muted); margin-top: 16px; }
    .login-link a { color: var(--blue); font-weight: 600; text-decoration: none; }
    .alert { padding: 12px 16px; border-radius: 10px; font-size: 13px; margin-bottom: 16px; display: none; }
    .alert-error { background: var(--red-bg); color: var(--red); border: 1px solid #FFCDD2; }
    .alert-success { background: var(--green-bg); color: var(--green); border: 1px solid #A5D6A7; }
    .alert.show { display: block; }
  </style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-brand">MamaFua</a>
  <div class="nav-right">
    <a href="login.html">Already have an account? Log in</a>
  </div>
</nav>

<div class="page">
  <div class="card">
    <h2 class="card-title">Create your account</h2>
    <p class="card-sub">Find trusted mama fuas near you in minutes</p>

    <div class="alert alert-error" id="error-msg"></div>
    <div class="alert alert-success" id="success-msg"></div>

    <div class="field-row">
      <div class="field">
        <label>First name</label>
        <input type="text" id="first_name" placeholder="e.g. Jane"/>
      </div>
      <div class="field">
        <label>Last name</label>
        <input type="text" id="last_name" placeholder="e.g. Njeri"/>
      </div>
    </div>

    <div class="field">
      <label>Email address</label>
      <input type="email" id="email" placeholder="jane@email.com"/>
    </div>

    <div class="field">
      <label>Phone number</label>
      <input type="tel" id="phone" placeholder="+254 7XX XXX XXX"/>
    </div>

    <div class="field">
      <label>Location / Estate</label>
      <input type="text" id="location" placeholder="e.g. Kilimani, Nairobi"/>
    </div>

    <div class="field">
      <label>Password</label>
      <input type="password" id="password" placeholder="Create a strong password"/>
    </div>

    <button class="btn-submit" id="submit-btn" onclick="registerClient()">
      Create my account →
    </button>

    <div class="login-link">
      Already have an account? <a href="login.html">Log in here</a>
    </div>
  </div>
</div>

<script>
  const API = "https://mamafua-backend.onrender.com";

  async function registerClient() {
    const btn = document.getElementById("submit-btn");
    const errorMsg = document.getElementById("error-msg");
    const successMsg = document.getElementById("success-msg");

    // Hide previous messages
    errorMsg.classList.remove("show");
    successMsg.classList.remove("show");

    // Get form values
    const first_name = document.getElementById("first_name").value.trim();
    const last_name  = document.getElementById("last_name").value.trim();
    const email      = document.getElementById("email").value.trim();
    const phone      = document.getElementById("phone").value.trim();
    const location   = document.getElementById("location").value.trim();
    const password   = document.getElementById("password").value;

    // Basic validation
    if (!first_name || !last_name || !email || !phone || !location || !password) {
      errorMsg.textContent = "Please fill in all fields";
      errorMsg.classList.add("show");
      return;
    }

    if (password.length < 6) {
      errorMsg.textContent = "Password must be at least 6 characters";
      errorMsg.classList.add("show");
      return;
    }

    // Disable button and show loading
    btn.disabled = true;
    btn.textContent = "Creating account...";

    try {
      const response = await fetch(`${API}/api/auth/register-client`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ first_name, last_name, email, phone, location, password })
      });

      const data = await response.json();

      if (response.ok) {
        // Save token and user to localStorage
        localStorage.setItem("mamafua_token", data.token);
        localStorage.setItem("mamafua_user", JSON.stringify(data.user));

        // Show success message
        successMsg.textContent = "Account created! Redirecting...";
        successMsg.classList.add("show");

        // Redirect to browse page after 1.5 seconds
        setTimeout(() => {
          window.location.href = "browse.html";
        }, 1500);

      } else {
        errorMsg.textContent = data.detail || "Something went wrong. Please try again.";
        errorMsg.classList.add("show");
        btn.disabled = false;
        btn.textContent = "Create my account →";
      }

    } catch (error) {
      errorMsg.textContent = "Cannot connect to server. Make sure the backend is running.";
      errorMsg.classList.add("show");
      btn.disabled = false;
      btn.textContent = "Create my account →";
    }
  }
</script>

</div>
</body>
</html>
